<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StatsTube — Youtube Channel Stats</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23FF0000'/><path d='M26 20l18 12-18 12z' fill='white'/></svg>">
    <script>
    try { if (localStorage.getItem('statstube-theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
    <header class="sticky-head">
        <div class="topbar">
            <div class="brand">
                <i class="fab fa-youtube"></i>
                <span>StatsTube</span>
            </div>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
                <i class="fas fa-moon"></i>
            </button>
        </div>
        <div class="search-row">
            <div class="input-group">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="channelId" placeholder="Channel ID, @handle or URL" autocomplete="off">
                <button class="clear-btn" id="clearBtn" aria-label="Clear"><i class="fas fa-times"></i></button>
                <button class="go-btn" id="fetchButton">Go</button>
            </div>
        </div>
    </header>

    <main class="page">
        <div class="recent-searches" id="recentSearches" style="display:none">
            <div class="recent-label">Recent</div>
            <div class="recent-chips" id="recentChips"></div>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="loading" id="loading">
            <div class="loading-spinner"></div>
            <p>Fetching channel stats...</p>
        </div>

        <div class="empty-state" id="emptyState">
            <i class="fab fa-youtube"></i>
            <p>Search any YouTube channel<br>to see its stats</p>
        </div>

        <section class="results" id="channelInfo">
            <div class="channel-banner" id="channelBanner"></div>

            <div class="id-row">
                <div class="channel-avatar" id="channelAvatar"></div>
                <div class="id-text">
                    <div class="channel-name" id="channelName"></div>
                    <div class="channel-handle-row">
                        <span class="channel-handle" id="channelHandle"></span>
                        <button class="copy-btn" id="copyHandleBtn" aria-label="Copy handle"><i class="fas fa-copy"></i></button>
                    </div>
                </div>
                <a class="visit-link" id="visitChannelBtn" href="#" target="_blank" rel="noopener">
                    Visit <i class="fas fa-external-link-alt"></i>
                </a>
            </div>

            <div class="stat-strip">
                <div class="stat">
                    <div class="stat-value" id="statSubs"></div>
                    <div class="stat-label">Subscribers</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="statViews"></div>
                    <div class="stat-label">Views</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="statVideos"></div>
                    <div class="stat-label">Videos</div>
                </div>
            </div>

            <div class="milestone" id="milestoneWrap" style="display:none">
                <div class="milestone-label" id="milestoneLabel"></div>
                <div class="milestone-bar"><div class="milestone-fill" id="milestoneFill"></div></div>
            </div>

            <section class="block" id="latestSection" style="display:none">
                <div class="block-head">
                    <h2>Latest videos</h2>
                    <a class="see-all" id="seeAllVideos" href="#" target="_blank" rel="noopener">View all</a>
                </div>
                <div class="video-row" id="latestVideos"></div>
            </section>

            <section class="block">
                <h2>Details</h2>
                <div class="details">
                    <div class="drow"><span class="dkey">Country</span><span class="dval" id="detailCountry"></span></div>
                    <div class="drow"><span class="dkey">Joined</span><span class="dval" id="detailJoined"></span></div>
                    <div class="drow"><span class="dkey">Channel age</span><span class="dval" id="detailAge"></span></div>
                    <div class="drow"><span class="dkey">Avg views / video</span><span class="dval" id="detailAvgViews"></span></div>
                    <div class="drow"><span class="dkey">Views / subscriber</span><span class="dval" id="detailViewsPerSub"></span></div>
                    <div class="drow"><span class="dkey">Videos / month</span><span class="dval" id="detailVideosPerMonth"></span></div>
                    <div class="drow">
                        <span class="dkey">Channel ID</span>
                        <span class="dval id-val"><span id="detailId"></span><button class="copy-btn" id="copyIdBtn" aria-label="Copy channel ID"><i class="fas fa-copy"></i></button></span>
                    </div>
                </div>
            </section>

            <section class="block" id="tagsBlock" style="display:none">
                <h2>Keywords</h2>
                <div class="tags" id="channelTags"></div>
            </section>

            <section class="block" id="descBlock">
                <h2>About</h2>
                <p class="desc" id="channelDescription"></p>
                <button class="text-btn" id="descToggle" style="display:none">Show more</button>
            </section>

            <div class="actions">
                <button class="action-btn" id="shareBtn"><i class="fas fa-share-alt"></i> Share</button>
                <button class="action-btn" id="copyStatsBtn"><i class="fas fa-clipboard"></i> Copy stats</button>
            </div>
        </section>
    </main>

    <footer>
        Made with <span class="heart">❤️</span> by Sauravhhh
    </footer>

    <script src="script.js?v=3"></script>
</body>
</html>
